name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The generated configs are validated by the real dnspatch of the release
      # whose schema the site ships, so a schema change cannot break them unseen.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - run: npm run schemas
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Test against dnspatch -check-config
        run: |
          tag=$(node -p "require('./public/schema/index.json').default")
          # The full flavour, so that configs with notifiers are accepted too.
          go install -tags "ping,notify_all" "github.com/dnspatch/dnspatch/cmd/dnspatch@${tag}"
          DNSPATCH_BIN="$(go env GOPATH)/bin/dnspatch" DNSPATCH_TAG="${tag}" npm test
      - run: npm run build
      # The runner has Chrome installed, which the tests use; nothing is downloaded.
      - name: Browser tests
        run: npm run e2e
        env:
          CI: "true"
